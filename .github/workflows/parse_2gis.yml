name: Run 2GIS Parser (Headless Chrome)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Список ссылок 2ГИС (через пробел или перенос строки)'
        required: true
        type: string
      format:
        description: 'Формат выгрузки (csv, xlsx, json)'
        required: true
        default: 'xlsx'
        type: choice
        options:
          - xlsx
          - csv
          - json
      max_records:
        description: 'Максимум записей с одной ссылки'
        required: false
        default: '1000'
        type: string

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies (CLI mode without Tkinter)
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic<2.0.0" requests pychrome websocket-client openpyxl psutil

      - name: Run original parser-2gis.py
        env:
          INPUT_URLS: ${{ github.event.inputs.urls }}
          INPUT_FORMAT: ${{ github.event.inputs.format }}
          INPUT_MAX: ${{ github.event.inputs.max_records }}
        run: |
          mkdir -p output
          OUT_FILE="output/2gis_result.${INPUT_FORMAT}"
          mapfile -t URL_ARRAY < <(echo "$INPUT_URLS" | tr ' ' '\n' | sed '/^$/d')
          echo "Запуск парсинга для ${#URL_ARRAY[@]} ссылок..."
          python parser-2gis.py -i "${URL_ARRAY[@]}" -o "$OUT_FILE" -f "$INPUT_FORMAT" \
            --chrome.headless yes \
            --chrome.disable-images yes \
            --parser.max-records "$INPUT_MAX" \
            --writer.verbose yes

      - name: Upload Parsed Result (Скачать в 1 клик)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2gis-parsed-${{ github.run_number }}
          path: output/*
          retention-days: 14
